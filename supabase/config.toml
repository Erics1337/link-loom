project_id = "link-loom"

[api]
enabled = true
port = 56421
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 56422
shadow_port = 56420
major_version = 15

[studio]
enabled = true
port = 56423
api_url = "http://127.0.0.1:56421"

[inbucket]
enabled = true
port = 56424
smtp_port = 56425
pop3_port = 56426

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://127.0.0.1:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_CLIENT_SECRET)"
redirect_uri = "http://127.0.0.1:56421/auth/v1/callback"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 56429

[analytics]
enabled = false
port = 56427
vector_port = 56428

# Redis Service Configuration
# Note: Supabase CLI doesn't natively support adding arbitrary containers via this config.
# However, we can keep using docker-compose.yml for Redis alongside 'supabase start'.
